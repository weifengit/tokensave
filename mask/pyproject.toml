[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docmask"
version = "1.0.0"
description = "本地离线文档 & 对话脱敏（正则 + 自定义词表 + GLiNER-small，不联网）"
requires-python = ">=3.10"
dependencies = [
  "python-docx>=1.1.0",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1.2",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
gliner = ["gliner>=0.2.13"]

[project.scripts]
docmask = "docmask.cli:main"

[tool.setuptools.packages.find]
include = ["docmask*"]
